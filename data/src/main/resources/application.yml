server:
  port: 8085

spring:
  application:
    name: data-service
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:mysql://10.0.0.6:13306/map_oxygen?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: mysql123
    druid:
      initial-size: 5 #连接池初始化大小
      min-idle: 10 #最小空闲连接数
      max-active: 20 #最大连接数
      web-stat-filter:
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*" #不统计这些请求数据
      stat-view-servlet: #访问监控网页的登录用户名和密码
        login-username: druid
        login-password: druid
  kafka:
    bootstrap-servers: 10.0.0.6:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: data-group-${random.uuid}
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: MANUAL_IMMEDIATE
      missing-topics-fatal: false

mybatis:
  mapper-locations:
    - classpath*:cloud/catfish/mbg/mapper/*.xml

logging:
  level:
    root: info
    cloud.catfish.data: debug
    org.springframework.kafka: debug
