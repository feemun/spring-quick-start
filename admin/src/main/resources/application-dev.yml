spring:
  datasource:
    url: jdbc:mysql://10.0.0.6:13306/map_oxygen?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: mysql123
    druid:
      initial-size: 5 #连接池初始化大小
      min-idle: 10 #最小空闲连接数
      max-active: 20 #最大连接数
      web-stat-filter:
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*" #不统计这些请求数据
      stat-view-servlet: #访问监控网页的登录用户名和密码
        login-username: druid
        login-password: druid
  data:
    redis:
      host: 10.0.0.6 # Redis服务器地址
      database: 0 # Redis数据库索引（默认为0）
      port: 16379 # Redis服务器连接端口
#      password:  # Redis服务器连接密码（默认为空）
      timeout: 300ms # 连接超时时间（毫秒）

minio:
  endpoint: http://10.0.0.6:9000 #MinIO服务所在地址
  bucketName: map #存储桶名称
  accessKey: minioadmin #访问的key
  secretKey: minioadmin #访问的秘钥

logging:
  level:
    root: info
    cloud.catfish.admin: debug

logstash:
  host: localhost
  enableInnerLog: false

elasticsearch:
  hosts: http://10.0.0.6:19200

#  username: elastic
#  password: changeme

  # 如果你使用 API Key，填 apiKey，用户名密码可不填
#  apiKey: ""

  # 连接池 & 超时设置
  connection-timeout: 3000       # 建立连接超时
  socket-timeout: 30000          # 读写超时
  max-retry-timeout: 60000       # 最大重试时间
  max-conn-total: 200            # 最大连接数
  max-conn-per-route: 50         # 每路由最大连接数

  # SSL
  verify-hostname: false          # 是否校验证书 hostname（生产建议 true）
  trust-all-cert: false          # 是否信任所有证书（ONLY 用于测试）
