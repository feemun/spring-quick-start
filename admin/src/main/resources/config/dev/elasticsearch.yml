elasticsearch:
  hosts: http://10.0.0.6:19200
  #  username: elastic
  #  password: changeme
  #  apiKey: ""
  
  # 连接池 & 超时设置
  connection-timeout: 3000       # 建立连接超时
  socket-timeout: 30000          # 读写超时
  max-retry-timeout: 60000       # 最大重试时间
  max-conn-total: 200            # 最大连接数
  max-conn-per-route: 50         # 每路由最大连接数

  # SSL
  verify-hostname: false          # 是否校验证书 hostname（生产建议 true）
  trust-all-cert: false          # 是否信任所有证书（ONLY 用于测试）
